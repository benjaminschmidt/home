title: IngredientDto
type: object
description: "A weight-volume conversion includes both amounts and both units, or omits all four."
required: [
  "id", "name", "ingredientVariants", "customUnits"
]
properties:
  id:
    type: string
    format: uuid
    readOnly: true
  name:
    type: string
    nullable: false
  conversionWeightAmount:
    type: number
    format: double
    minimum: 0
    exclusiveMinimum: true
  conversionVolumeAmount:
    type: number
    format: double
    minimum: 0
    exclusiveMinimum: true
  conversionWeightUnit:
    $ref: './WeightUnitDto.yaml'
  conversionVolumeUnit:
    $ref: './VolumeUnitDto.yaml'
  ingredientVariants:
    type: array
    description: "List of variants. Note: At most one variant in this list should have 'defaultVariant' set to true."
    items:
      $ref: './IngredientVariantDto.yaml'
  customUnits:
    type: array
    items:
      $ref: './CustomUnitDto.yaml'
