title: IngredientWriteRequest
type: object
description: "Writable ingredient properties. Variants and custom units are managed through their nested resource endpoints."
required: [
  "name"
]
properties:
  name:
    type: string
    nullable: false
  weightToVolumeConversionFactor:
    type: number
    format: double
  conversionWeightUnit:
    $ref: './WeightUnitDto.yaml'
  conversionVolumeUnit:
    $ref: './VolumeUnitDto.yaml'
  defaultVariantId:
    type: string
    format: uuid
