title: IngredientWriteRequest
type: object
description: >-
  Writable ingredient properties. Variants and custom units are managed through
  their nested resource endpoints. A weight-volume conversion must include both
  amounts and both units, or omit all four.
required: [
  "name"
]
properties:
  name:
    type: string
    nullable: false
  conversionWeightAmount:
    type: number
    format: double
    minimum: 0
    exclusiveMinimum: true
  conversionVolumeAmount:
    type: number
    format: double
    minimum: 0
    exclusiveMinimum: true
  conversionWeightUnit:
    $ref: './WeightUnitDto.yaml'
  conversionVolumeUnit:
    $ref: './VolumeUnitDto.yaml'
  defaultVariantId:
    type: string
    format: uuid
